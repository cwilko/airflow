name: Publish Docker image

on: 
  push:
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        env:
          AIRFLOW_GPL_UNIDECODE: yes
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/airflow:latest
          build-args: |
            AIRFLOW_VERSION=2.8.4
            AIRFLOW_EXTRAS=cncf-kubernetes,virtualenv,postgres,redis,celery
            PYTHON_BASE_IMAGE=python:3.9-slim-bullseye
            INSTALL_MYSQL_CLIENT=false
            INSTALL_MSSQL_CLIENT=false
            ADDITIONAL_RUNTIME_APT_DEPS=git sshpass
            TZ=Europe/London

